<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VN Smart | Painel do Vendedor</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="products-page seller-panel-page">
  <header class="topbar">
    <div class="topbar-inner">
      <a class="mini-brand" href="painel-vendedor.html">
        <img src="assets/logo.jpeg" alt="VN Smart" />
        <div>
          <strong>VN SMART</strong>
          <span>PAINEL DO VENDEDOR</span>
        </div>
      </a>
      <div class="topbar-actions">
        <div class="phone-badge seller-name-badge" id="sellerNameBadge"></div>
        <button id="sellerLogout" class="btn btn-outline">SAIR</button>
      </div>
    </div>
  </header>

  <main class="products-container">
    <section class="hero-products seller-hero">
      <div>
        <span class="brand-kicker">VN SMART • ÁREA DE VENDAS</span>
        <h1>Olá, <span id="sellerName"></span>!</h1>
        <p>Atendimento e vendas da VN Smart • Assistência Técnica.</p>
      </div>
      <div class="hero-line"></div>
    </section>

    <section class="seller-dashboard-grid">
      <article class="admin-main-card seller-welcome-card">
        <span class="cart-kicker">SUA CONTA</span>
        <h2>Dados de acesso</h2>
        <div class="seller-profile-row">
          <div class="seller-avatar large" id="sellerAvatar">V</div>
          <div>
            <strong id="profileName"></strong>
            <p id="profileUsername"></p>
            <span class="status-pill on">Conta ativa</span>
          </div>
        </div>
        <div class="seller-panel-actions">
          <a class="btn btn-primary" href="index.html">IR PARA A LOJA</a><a class="btn btn-outline" href="cliente.html">PAINEL CLIENTE</a>
          <button id="sellerLogout2" class="btn btn-outline">SAIR DA CONTA</button>
        </div>
      </article>

      <article class="admin-main-card">
        <div class="section-heading compact">
          <div><span class="cart-kicker">PEDIDOS</span><h2>Pedidos recentes</h2></div>
        </div>
        <div id="sellerOrders" class="admin-orders"></div>
      </article>
    </section>
  </main>

  <script src="store.js"></script>
  <script src="vendedor.js"></script>
</body>
</html>
